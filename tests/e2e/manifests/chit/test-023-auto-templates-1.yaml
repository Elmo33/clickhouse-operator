# test_023

apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallationTemplate"

metadata:
  name: clickhouse-stable
spec:
  templating:
    policy: auto
  defaults:
    templates:
      podTemplate: default
  templates:
    podTemplates:
      - name: default
        spec:
          containers:
            - name: clickhouse-pod
              image: altinityinfra/clickhouse-server:0-26.3.13.10001.altinitytest            
              env:
                - name: TEST_ENV_FROM_CHIT_1
                  value: TEST_ENV_FROM_CHIT_1_VALUE