apiVersion: v1
kind: ConfigMap
metadata:
  name: test-030017-clickhouse-tls12-config
data:
  ports.xml: |
    <clickhouse>
      <https_port>8443</https_port>
      <http_port remove="1"/>
      <tcp_port remove="1"/>
      <interserver_http_port remove="1"/>
      <mysql_port remove="1"/>
      <postgresql_port remove="1"/>
    </clickhouse>
  openssl.xml: |
    <clickhouse>
      <openSSL>
        <server>
          <certificateFile>/etc/clickhouse-server/certs/server.crt</certificateFile>
          <privateKeyFile>/etc/clickhouse-server/certs/server.key</privateKeyFile>
          <dhParamsFile>/etc/clickhouse-server/certs/dhparam.pem</dhParamsFile>
          <verificationMode>none</verificationMode>
          <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_3</disableProtocols>
          <cipherSuites>TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384</cipherSuites>
        </server>
      </openSSL>
    </clickhouse>
---
apiVersion: v1
kind: Pod
metadata:
  name: test-030017-clickhouse-tls12
  labels:
    app: test-030017-clickhouse-tls12
spec:
  containers:
    - name: clickhouse
      image: altinity/clickhouse-server:25.3.8.30001.altinityfips
      env:
        - name: CLICKHOUSE_USER
          value: clickhouse_operator
        - name: CLICKHOUSE_PASSWORD
          value: clickhouse_operator_password
      ports:
        - containerPort: 8443
          name: https
      volumeMounts:
        - name: config
          mountPath: /etc/clickhouse-server/config.d
        - name: certs
          mountPath: /etc/clickhouse-server/certs
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: test-030017-clickhouse-tls12-config
        items:
          - key: ports.xml
            path: ports.xml
          - key: openssl.xml
            path: openssl.xml
    - name: certs
      secret:
        secretName: clickhouse-certs
